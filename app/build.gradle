plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlinx-serialization'
    id 'kotlin-parcelize'
    id 'androidx.navigation.safeargs'
    id 'dagger.hilt.android.plugin'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.poe.poegps'
    compileSdk 36

    defaultConfig {
        // satellite imagery: an ArcGIS Location Platform key in local.properties (esri.apiKey=…), never in git
        def localProps = new Properties()
        def localFile = rootProject.file('local.properties')
        if (localFile.exists()) localFile.withInputStream { localProps.load(it) }
        buildConfigField "String", "ESRI_API_KEY", "\"${localProps.getProperty('esri.apiKey', '')}\""
        applicationId "com.poe.poegps"
        minSdk 24
        targetSdk 36
        versionCode 16
        versionName "2.3.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // field phones are ARM; x86/x86_64 copies of libmaplibre.so (~23 MB) only serve emulators
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            applicationVariants.all { variant ->
                variant.outputs.all {
                    outputFileName = new File("POEGPS2-${variant.versionName}.apk")
                }
            }}
    }
    // play: Google Play installs and updates it (Play In-App Updates);
    // direct: the sideloaded APK for phones without Google services, updates itself from the GIS server
    flavorDimensions = ['distribution']
    productFlavors {
        play {
            dimension 'distribution'
        }
        direct {
            dimension 'distribution'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        compose true
        buildConfig true
    }
}

kotlin {
    jvmToolchain(17)
}

// The sideloaded build updates itself from the GIS server (DEPLOY.md in POEGPS_api): its release.properties is
// written next to the APK, wherever the signing wizard puts it, from the version above and
// src/direct/release-notes.txt (one item per line). A release = the APK, then this file, into the server's update/.
android.applicationVariants.all { variant ->
    if (variant.name != 'directRelease') return
    def notesFile = file('src/direct/release-notes.txt')
    variant.packageApplicationProvider.configure { task ->
        task.inputs.file(notesFile)
        task.doLast {
            def notes = notesFile.readLines('UTF-8').collect { it.trim() }.findAll { it }
                .collect { '• ' + it.replace('\\', '\\\\') }.join('\\n')
            def text = """versionCode=${variant.versionCode}
versionName=${variant.versionName}
# raise only when old versions must not upload: /save refuses every phone below it
minVersionCode=0
apk=POEGPS2-${variant.versionName}.apk
notes=${notes}
"""
            new File(task.outputDirectory.get().asFile, 'release.properties').write(text, 'UTF-8')
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.10.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    //compose
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.6.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    //map
    implementation 'org.maplibre.gl:android-sdk:11.13.5'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.1"
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"
    implementation 'androidx.paging:paging-common-ktx:3.1.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.paging:paging-runtime-ktx:3.1.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1'
    //navigation
    def nav_version = "2.5.3"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"
    //network
    def retrofit_version = "2.9.0"
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"
    implementation "com.squareup.okhttp3:okhttp:4.9.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.9.0"
    // di hilt
    def hilt_version = "2.52"
    implementation "com.google.dagger:hilt-android:$hilt_version"
    ksp "com.google.dagger:hilt-android-compiler:$hilt_version"
    //For Hilt support for ViewModel
    ksp 'androidx.hilt:hilt-compiler:1.2.0'
    //Kotlin Coroutines
    def coroutines_version = "1.8.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"
    //Room Database
    implementation "androidx.room:room-runtime:2.6.1"
    ksp "androidx.room:room-compiler:2.6.1"
    //Paging support for Room
    implementation "androidx.room:room-paging:2.6.1"
    //datastore preferences
    implementation "androidx.datastore:datastore-preferences:1.0.0"
    //Kotlin Extensions and Coroutines support for Room
    implementation "androidx.room:room-ktx:2.6.1"
    // debugImplementation because LeakCanary should only run in debug builds.
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.10'
    // Play In-App Updates: only in the Play build, the direct one updates from the GIS server
    playImplementation 'com.google.android.play:app-update-ktx:2.1.0'
    //handle permission requests
    implementation 'com.guolindev.permissionx:permissionx:1.7.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}